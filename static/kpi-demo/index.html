VIEWS.probeval=()=>{
  const p=probOf(ME.id),d=DEPT[p.dept];
  if(!p.res.length) return `<div class="hdr"><div><h1>Phiếu KPI thử việc</h1></div></div>
    <div class="card sec"><div class="empty"><span class="ic">◐</span>
      Quản lý chưa giao mục tiêu thử việc.<br>Khi ${empName(p.mgr)} giao xong, phiếu sẽ hiện ở đây.</div></div>`;
  const i=TAB==='1'?1:TAB==='0'?0:probIdx(p);
  const m=p.m[i],edit=m.status==='draft'&&i===probIdx(p);
  const sc=probMonthScore(p,i,m.status==='done'?'mgr':'self');
  const[wr,wo]=PROB.w[i];
  return `<div class="hdr"><div><h1>Phiếu KPI thử việc</h1>
      <div class="sub">${p.name} · ${p.title} · ${d.n} · hết thử việc ${fmtD(p.probEnd)}</div></div>
    <div class="sp"></div>${bdgS(m.status==='done'?'done':m.status==='self'?'self':'draft')}</div>

  <div class="row sec" style="gap:10px">
    ${[0,1].map(x=>`<button class="btn tiny ${x===i?'ghost':''}" data-go="probeval|${x}">Tháng thử việc ${x+1}</button>`).join('')}
  </div>

  <div class="card sec">
    <div class="row" style="margin-bottom:6px"><h2>Chỉ tiêu kết quả · ${wr}% điểm${helpLink('dienform','Cách điền phiếu và ví dụ')}</h2>
      <div class="sp"></div>${edit?'<span class="mut" style="font-size:12px">Nhập số thực tế, không nhập %</span>':''}</div>
    <table><thead><tr><th style="width:36%">Chỉ tiêu</th><th class="num">Mục tiêu tháng ${i+1}</th>
      <th class="num">${edit?'Bạn nhập':'Bạn báo'}</th><th class="num">%</th>
      ${m.status==='done'?'<th class="num">Quản lý chấm</th><th class="num">%</th>':''}</tr></thead><tbody>
    ${p.res.map((ki,j)=>{const k=d.kpis[ki],tg=p.tg[i][j];
      const sv=m.self[j]??'',sp=pctOf(k,tg,sv===''?null:Number(sv));
      const mv=m.mgr[j]??'',mp=pctOf(k,tg,mv===''?null:Number(mv));
      return `<tr><td><b class="hd" style="font-size:12.5px">${k.c}</b>
          <div class="mut" style="font-size:11px">${k.u} · ${k.d===1?'càng cao càng tốt':'càng thấp càng tốt'}</div>
          ${edit?`<div class="mut" style="font-size:11px;color:var(--dim)">Nhập ${k.u} thực tế đạt trong tháng</div>`:''}</td>
        <td class="num tnum">${fmtM(tg)}</td>
        <td class="num" style="width:130px">${edit
          ?`<input class="inp num" data-pv="${j}" type="number" step="any" value="${sv}" placeholder="ví dụ ${fmtM(r1(tg*0.98))}">`
          :`<span class="tnum">${sv===''?'-':fmtM(sv)}</span>`}</td>
        <td class="num tnum" style="font-weight:700;color:${clr(sp)}">${sp==null?'-':sp+'%'}</td>
        ${m.status==='done'?`<td class="num tnum">${mv===''?'-':fmtM(mv)}</td>
          <td class="num tnum" style="font-weight:700;color:${clr(mp)}">${mp==null?'-':mp+'%'}</td>`:''}</tr>`}).join('')}
    </tbody></table>
  </div>

  <div class="card sec">
    <h2>Chỉ tiêu hội nhập · ${wo}% điểm</h2>
    <div class="mut" style="font-size:12px;margin-bottom:12px">Tự chấm thang 1 đến 5, mức 4 là đạt yêu cầu của vị trí</div>
    <table><thead><tr><th style="width:42%">Nội dung</th><th>Yêu cầu</th>
      <th class="num">${edit?'Bạn tự chấm':'Bạn chấm'}</th>${m.status==='done'?'<th class="num">Quản lý chấm</th>':''}</tr></thead><tbody>
    ${ONBOARD_KPI.map((k,j)=>`<tr><td><b class="hd" style="font-size:12.5px">${k.c}</b></td>
      <td class="mut" style="font-size:11.5px">${k.h}</td>
      <td class="num" style="width:230px">${edit
        ?seg('po'+j,[1,2,3,4,5].map(v=>[v,v]),m.onbSelf[j]===''||m.onbSelf[j]==null?4:m.onbSelf[j])
        :`<span class="tnum">${m.onbSelf[j]??'-'}/5</span>`}</td>
      ${m.status==='done'?`<td class="num tnum">${m.onbMgr[j]??'-'}/5</td>`:''}</tr>`).join('')}
    </tbody></table>
    <div class="well row" style="margin-top:12px"><b class="hd">Điểm tháng thử việc ${i+1}</b><div class="sp"></div>
      <span class="big" style="color:${clr(sc)}">${sc==null?'-':sc+'%'}</span></div>
  </div>

  <div class="g2 sec">
    <div class="card"><h2>Tự nhận xét</h2>
      ${edit?`<textarea class="inp" id="probNote" placeholder="Việc đã làm được, khó khăn, điều cần hỗ trợ...">${m.note||''}</textarea>`
        :`<div class="well" style="font-size:12.5px;min-height:66px">${m.note||'<span class="dim">Chưa có</span>'}</div>`}
    </div>
    <div class="card"><h2>Nhận xét của quản lý</h2>
      <div class="well" style="font-size:12.5px;min-height:66px">${m.status==='done'&&m.mgrNote?m.mgrNote:'<span class="dim">Chưa có</span>'}</div>
    </div>
  </div>

  <div class="row" style="gap:10px">
    ${edit?`<button class="btn primary" data-act="pSend|${i}">Gửi quản lý chấm</button>
      <span class="mut" style="font-size:12px">Gửi cho ${empName(p.mgr)}. Điểm này không ảnh hưởng lương tháng, chỉ dùng để xét ký HĐLĐ.</span>`
      :`<button class="btn ghost" data-go="probhome">Quay lại</button>
        <span class="mut" style="font-size:12px">${m.status==='done'?'Quản lý đã chấm xong tháng này.':'Đã gửi, đang chờ quản lý chấm.'}</span>`}
  </div>`;
};

/* ─── QUẢN LÝ: giao mục tiêu, chấm, kết luận ─── */
VIEWS.mgrprob=()=>{
  const mine=probList().filter(p=>p.mgr===ME.id||p.dept===ME.dept);
  const sel=SEL&&probOf(SEL)&&mine.some(p=>p.id===SEL)?probOf(SEL):mine[0];
  return `<div class="hdr"><div><h1>Nhân viên thử việc</h1>
      <div class="sub">${DEPT[ME.dept].n} · thử việc ${PROB.days} ngày · hưởng 100% lương${helpLink('thuviec','Quy trình thử việc và mức kết luận')}</div></div></div>
  ${!mine.length?'<div class="card sec"><div class="empty">Phòng bạn không có nhân viên thử việc.</div></div>':`
  <div class="card sec"><table><thead><tr><th>Nhân sự</th><th>Vào làm</th><th>Hết thử việc</th>
    <th class="num">Tháng 1</th><th class="num">Tháng 2</th><th>Tình trạng</th><th></th></tr></thead><tbody>
  ${mine.map(p=>{const f=probFinal(p);
    return `<tr${sel&&sel.id===p.id?' style="font-weight:600"':''}>
      <td><b class="hd">${p.name}</b><div class="mut" style="font-size:11px">${p.title}</div></td>
      <td class="mut">${fmtD(p.joined)}</td>
      <td class="mut">${fmtD(p.probEnd)} <span class="dim">· còn ${probDaysLeft(p)} ngày</span></td>
      <td class="num tnum">${p.m[0].status==='done'?probMonthScore(p,0,'mgr')+'%':'-'}</td>
      <td class="num tnum">${p.m[1].status==='done'?probMonthScore(p,1,'mgr')+'%':'-'}</td>
      <td>${p.concl?`<span class="pill ${PV[p.concl.res].cls}"><i class="dot" style="background:currentColor"></i>${PV[p.concl.res].n.split(' · ')[0]}</span>`
        :!p.res.length?'<span class="pill r"><i class="dot" style="background:currentColor"></i>chưa giao mục tiêu</span>'
        :bdgS(p.m[probIdx(p)].status==='self'?'self':'draft')}</td>
      <td class="num"><button class="btn tiny" data-sel="${p.id}">Mở</button></td></tr>`}).join('')}
  </tbody></table></div>
  ${sel?probMgrPanel(sel):''}`}`;
};

function probMgrPanel(p){
  const d=DEPT[p.dept];
  if(!p.res.length) return `<div class="card sec">
    <h2>Giao mục tiêu thử việc cho ${p.name}</h2>
    <div class="mut" style="font-size:12px;margin-bottom:14px">
      Chọn 2 đến 3 chỉ tiêu kết quả từ bộ chỉ tiêu của ${d.n}. Hai chỉ tiêu hội nhập được thêm tự động cho mọi vị trí.
      Mục tiêu tháng 1 bằng ${Math.round(PROB.m1*100)}% và tháng 2 bằng ${Math.round(PROB.m2*100)}% mức của nhân viên chính thức cùng cấp bậc.</div>
    <table><thead><tr><th style="width:44px"></th><th>Chỉ tiêu của phòng</th><th class="num">Đơn vị</th>
      <th class="num">Mục tiêu T1</th><th class="num">Mục tiêu T2</th></tr></thead><tbody>
    ${d.kpis.map((k,ki)=>{const q={...p,res:[ki]};
      return `<tr><td><input type="checkbox" data-pk="${ki}"></td>
        <td><b class="hd" style="font-size:12.5px">${k.c}</b></td>
        <td class="num mut">${k.u}</td>
        <td class="num tnum">${fmtM(probTargets(q,0)[0])}</td>
        <td class="num tnum">${fmtM(probTargets(q,1)[0])}</td></tr>`}).join('')}
    </tbody></table>
    <div class="row" style="margin-top:14px;gap:10px">
      <button class="btn primary" data-act="pAssign|${p.id}">Giao mục tiêu</button>
      <span class="mut" style="font-size:12px">Nhân viên chỉ xem, không sửa được mục tiêu.</span></div>
  </div>`;

  const i=probIdx(p),m=p.m[i];
  const f=probFinal(p),v=probVerdict(f);
  return `<div class="card sec">
    <div class="row" style="margin-bottom:12px"><h2>Chấm tháng thử việc ${i+1} · ${p.name}</h2><div class="sp"></div>
      ${bdgS(m.status==='done'?'done':m.status==='self'?'self':'draft')}</div>
    ${m.status==='draft'?'<div class="empty">Nhân viên chưa nộp phiếu tháng này.</div>':`
    <table><thead><tr><th style="width:34%">Chỉ tiêu</th><th class="num">Mục tiêu</th>
      <th class="num">NV báo</th><th class="num">Bạn chấm</th><th class="num">%</th></tr></thead><tbody>
    ${p.res.map((ki,j)=>{const k=d.kpis[ki],tg=p.tg[i][j];
      const mv=m.status==='done'?m.mgr[j]:(m.mgr[j]??m.self[j]);
      const mp=pctOf(k,tg,mv===''||mv==null?null:Number(mv));
      return `<tr><td><b class="hd" style="font-size:12.5px">${k.c}</b>
          <div class="mut" style="font-size:11px">${k.u}</div></td>
        <td class="num tnum">${fmtM(tg)}</td>
        <td class="num tnum">${m.self[j]===''||m.self[j]==null?'-':fmtM(m.self[j])}</td>
        <td class="num" style="width:120px">${m.status==='done'?`<span class="tnum">${fmtM(mv)}</span>`
          :`<input class="inp num" data-pm="${j}" type="number" step="any" value="${mv??''}">`}</td>
        <td class="num tnum" style="font-weight:700;color:${clr(mp)}">${mp==null?'-':mp+'%'}</td></tr>`}).join('')}
    ${ONBOARD_KPI.map((k,j)=>`<tr><td><b class="hd" style="font-size:12.5px">${k.c}</b>
        <div class="mut" style="font-size:11px">hội nhập · thang 1-5</div></td>
      <td class="num mut">4/5</td>
      <td class="num tnum">${m.onbSelf[j]??'-'}/5</td>
      <td class="num" style="width:230px">${m.status==='done'?`<span class="tnum">${m.onbMgr[j]}/5</span>`
        :seg('pn'+j,[1,2,3,4,5].map(x=>[x,x]),m.onbMgr[j]??m.onbSelf[j]??4)}</td>
      <td class="num tnum">${m.onbMgr[j]!=null?Math.round(m.onbMgr[j]/5*100)+'%':'-'}</td></tr>`).join('')}
    </tbody></table>
    <div class="lbl" style="margin-top:16px">Nhận xét của quản lý</div>
    ${m.status==='done'?`<div class="well" style="font-size:12.5px;margin-top:6px">${m.mgrNote||'-'}</div>`
      :`<textarea class="inp" id="pMgrNote" style="margin-top:6px" placeholder="Ghi nhận và điểm cần cải thiện...">${m.mgrNote||''}</textarea>
        <div class="row" style="margin-top:12px"><button class="btn primary" data-act="pMgrSave|${p.id}|${i}">Chấm xong tháng ${i+1}</button></div>`}`}
  </div>

  ${p.m[1].status==='done'&&!p.concl?`<div class="card sec">
    <h2>Kết luận thử việc · ${p.name}</h2>
    <div class="mut" style="font-size:12px;margin-bottom:14px">
      Điểm bình quân hai tháng là <b class="hd">${f}%</b>. Hệ thống chỉ cho chọn kết luận đúng khung điểm.</div>
    <div class="g3">
      ${Object.entries(PV).map(([k,x])=>`<div class="well" style="${v===k?'box-shadow:var(--sh-in-sm)':''}">
        <b class="hd" style="color:${x.col}">${x.n}</b>
        <div class="mut" style="font-size:11.5px;margin-top:5px">${
          k==='pass'?'Từ '+PROB.pass+' điểm trở lên':k==='cond'?'Từ '+PROB.cond+' đến '+(PROB.pass-1)+' điểm':'Dưới '+PROB.cond+' điểm'}</div>
        ${v===k?'<div class="mut" style="font-size:11.5px;margin-top:6px;font-weight:700">Khung điểm hiện tại</div>':''}</div>`).join('')}
    </div>
    <div class="lbl" style="margin-top:16px">Nhận xét kết luận · bắt buộc</div>
    <textarea class="inp" id="pConclNote" style="margin-top:6px" placeholder="Nêu rõ chỉ tiêu đạt và chưa đạt..."></textarea>
    <div class="row" style="margin-top:12px;gap:10px">
      <button class="btn primary" data-act="pConclude|${p.id}">Gửi kết luận cho HR</button>
      <span class="mut" style="font-size:12px">HR duyệt xong mới chuyển hồ sơ sang chính thức.</span></div>
  </div>`:''}

  ${p.concl?`<div class="card sec"><h2>Kết luận đã gửi</h2>
    <div class="well" style="margin-top:10px">
      <div class="row"><b class="hd" style="color:${PV[p.concl.res].col}">${PV[p.concl.res].n}</b>
        <div class="sp"></div><span class="big" style="font-size:22px;color:${clr(p.concl.score)}">${p.concl.score}%</span></div>
      <div class="mut" style="font-size:12.5px;margin-top:8px">${p.concl.note}</div>
      <div class="mut" style="font-size:11.5px;margin-top:8px">${fmtD(p.concl.at)} · ${p.concl.hr?'HR đã duyệt':'chờ HR duyệt'}</div>
    </div></div>`:''}`;
}

/* ─── HR: duyệt kết luận, chuyển sang chính thức ─── */
VIEWS.hrprob=()=>{
  const L=probList();
  const wait=L.filter(p=>p.concl&&!p.concl.hr);
  return `<div class="hdr"><div><h1>Nhân viên thử việc</h1>
      <div class="sub">${L.length} hồ sơ · thử việc ${PROB.days} ngày · hưởng 100% lương${helpLink('thuviec','Quy trình thử việc')}</div></div></div>

  <div class="tiles sec">
    ${tile('Đang thử việc',L.filter(p=>!p.concl).length,'Chưa có kết luận')}
    ${tile('Chờ HR duyệt',wait.length,'Kết luận quản lý đã gửi',wait.length?'var(--warn)':null)}
    ${tile('Chưa giao mục tiêu',L.filter(p=>!p.res.length).length,'Quản lý cần xử lý',L.filter(p=>!p.res.length).length?'var(--bad)':'var(--ok)')}
    ${tile('Hết hạn trong 7 ngày',L.filter(p=>probDaysLeft(p)<=7&&!p.concl).length,'Cần nhắc quản lý')}
  </div>

  <div class="card sec"><h2>Danh sách hồ sơ thử việc</h2>
    <table style="margin-top:10px"><thead><tr><th>Nhân sự</th><th>Phòng ban</th><th>Quản lý</th>
      <th>Hết thử việc</th><th class="num">Điểm</th><th>Kết luận</th><th></th></tr></thead><tbody>
    ${L.map(p=>{const f=probFinal(p);
      return `<tr><td><b class="hd">${p.name}</b><div class="mut" style="font-size:11px">${p.title} · vào ${fmtD(p.joined)}</div></td>
      <td class="mut">${DEPT[p.dept].n}</td><td class="mut">${empName(p.mgr)}</td>
      <td class="mut">${fmtD(p.probEnd)}<div class="mut" style="font-size:11px">còn ${probDaysLeft(p)} ngày</div></td>
      <td class="num tnum" style="font-weight:700;color:${clr(f)}">${f==null?'-':f+'%'}</td>
      <td>${p.concl?`<span class="pill ${PV[p.concl.res].cls}"><i class="dot" style="background:currentColor"></i>${PV[p.concl.res].n.split(' · ')[0]}</span>`
        :'<span class="pill n">chưa có</span>'}</td>
      <td class="num">${p.concl&&!p.concl.hr
        ?`<button class="btn tiny primary" data-act="pHrOk|${p.id}">Duyệt</button>`
        :p.concl?'<span class="mut" style="font-size:11.5px">đã duyệt</span>':''}</td></tr>`}).join('')}
    </tbody></table>
    ${wait.length?`<div class="well" style="margin-top:14px;font-size:12.5px">
      Duyệt kết luận <b class="hd">Đạt</b> sẽ chuyển hồ sơ sang nhân sự chính thức: nhận đủ ${DEPTS[0].kpis.length} chỉ tiêu của phòng,
      bật lương P3 và vào chu kỳ đánh giá từ tháng kế tiếp. Ngày vào làm giữ nguyên nên hệ số C.4 của thưởng năm tính đủ cả thời gian thử việc.</div>`:''}
  </div>`;
};

/* ─── HÀNH ĐỘNG THỬ VIỆC ─── */
Object.assign(ACT,{
  hrBack(id){const a=asm(id);a.status='back';a.mgrScore=null;
    save();SEL=null;toast('Đã trả phiếu về cho quản lý chấm lại');paint()},
  pAssign(id){
    const p=probOf(id);
    const ks=[...document.querySelectorAll('input[data-pk]:checked')].map(el=>Number(el.dataset.pk));
    if(ks.length<2||ks.length>3) return toast('Chọn 2 đến 3 chỉ tiêu kết quả');
    p.res=ks; p.tg=[probTargets(p,0),probTargets(p,1)];
    p.m.forEach(m=>{m.self=ks.map(()=>'');m.mgr=ks.map(()=>'');
      m.onbSelf=ONBOARD_KPI.map(()=>'');m.onbMgr=ONBOARD_KPI.map(()=>'')});
    save();toast('Đã giao mục tiêu thử việc cho '+p.name);paint();
  },
  pSend(i){
    const p=probOf(ME.id),m=p.m[Number(i)];
    m.self=p.res.map((_,j)=>{const el=document.querySelector(`input[data-pv="${j}"]`);
      return el&&el.value!==''?Number(el.value):''});
    m.onbSelf=ONBOARD_KPI.map((_,j)=>Number(segv('po'+j,4)));
    const nt=document.getElementById('probNote'); m.note=nt?nt.value:'';
    if(m.self.some(v=>v==='')) return toast('Còn chỉ tiêu chưa nhập số. Chưa có số thì ghi 0.');
    m.status='self';save();toast('Đã gửi phiếu cho '+empName(p.mgr));paint();
  },
  pMgrSave(id,i){
    const p=probOf(id),ix=Number(i),m=p.m[ix];
    m.mgr=p.res.map((_,j)=>{const el=document.querySelector(`input[data-pm="${j}"]`);
      return el&&el.value!==''?Number(el.value):m.self[j]});
    m.onbMgr=ONBOARD_KPI.map((_,j)=>Number(segv('pn'+j,m.onbSelf[j]||4)));
    const nt=document.getElementById('pMgrNote'); m.mgrNote=nt?nt.value:'';
    if(!m.mgrNote.trim()) return toast('Nhập nhận xét trước khi chấm xong');
    m.status='done';save();
    toast('Đã chấm xong tháng '+(ix+1)+' · điểm '+probMonthScore(p,ix,'mgr')+'%');paint();
  },
  pConclude(id){
    const p=probOf(id),f=probFinal(p);
    const nt=document.getElementById('pConclNote');
    if(!nt||!nt.value.trim()) return toast('Nhận xét kết luận là bắt buộc');
    p.concl={score:f,res:probVerdict(f),note:nt.value.trim(),by:ME.id,at:TODAY,hr:false};
    save();toast('Đã gửi kết luận cho HR · '+PV[p.concl.res].n);paint();
  },
  pHrOk(id){
    const p=probOf(id);
    p.concl.hr=true;
    if(p.concl.res==='fail'){save();toast('Đã duyệt · sinh phiếu chấm dứt trước hạn cho '+p.name);return paint()}
    toOfficial(p);
    save();toast(p.name+' đã chuyển sang nhân sự chính thức · nhận đủ chỉ tiêu phòng từ tháng sau');paint();
  }
});
/* chuyển hồ sơ thử việc sang nhân sự chính thức: mở đủ chỉ tiêu phòng, bật lương P3 */
function toOfficial(p){
  const d=DEPT[p.dept];
  const e={id:p.id,name:p.name,dept:p.dept,lv:p.lv,title:p.title,sal:p.sal,col:p.col,
    p1:Math.round(p.sal*LEVELS[p.lv].p1*10)/10,
    p2:Math.round(p.sal*(1-LEVELS[p.lv].p1)*10)/10,
    joined:p.joined,mgr:p.mgr,st:'official',
    p3p:{pt:4,pi:4,pd:4},dil:4,fromProb:true};
  DB.emps.push(e);
  const tg=genTargets(e);
  DB.asm[e.id+'|'+CUR]={period:CUR,emp:e.id,tg,self:d.kpis.map(()=>''),selfNote:'',
    mgrA:d.kpis.map(()=>''),mgrNote:'',status:'draft',selfScore:null,mgrScore:null};
  p.st='official';
}

/* ══════════════════════════════════════════════════════════════════════════
   THÊM / SỬA / NGỪNG DÙNG CHỈ TIÊU
   Phòng ban đề xuất → HR ký → HRD duyệt → (đổi kết quả phòng thì) TGĐ duyệt.
   Không hồi tố: đã duyệt tháng nào thì giữ nguyên tháng đó.
   ══════════════════════════════════════════════════════════════════════════ */
const nextP=p=>{let[y,m]=p.split('-').map(Number);m++;if(m>12){m=1;y++}
  return y+'-'+String(m).padStart(2,'0')};
const EFF=nextP(CUR);
const chgList=()=>DB.chg||[];
const chgOf=id=>chgList().find(c=>c.id===id);
const KIND={add:'Thêm chỉ tiêu',edit:'Sửa chỉ tiêu',drop:'Ngừng dùng chỉ tiêu'};
/* đổi kết quả tổng của phòng (thêm / bỏ chỉ tiêu, hoặc đổi trọng số) thì phải lên TGĐ */
const needCeoOf=(kind,w)=>kind!=='edit'||(w!=null&&w!=='');
/* người đang đăng nhập được xử lý phiếu ở bước nào */
const isHRD=()=>ROLE==='hr'&&(ME.lv==='D'||ME.lv==='X');
function chgCan(c){
  if(c.st==='prop'&&ROLE==='hr') return {act:'chgSign',n:'Ký đồng ý',hint:'HR xác nhận chỉ tiêu hợp lệ và đo được'};
  if(c.st==='hr'&&isHRD())       return {act:'chgApprove',n:'Duyệt chính thức',hint:'Giám đốc Nhân sự duyệt'};
  if(c.st==='hrd'&&ROLE==='ceo') return {act:'chgCeo',n:'Tổng Giám đốc duyệt',hint:'Vì phiếu này đổi kết quả của cả phòng'};
  return null;
}
/* trọng số còn lại được chia lại theo tỷ lệ khi thêm hoặc bỏ chỉ tiêu */
function reweight(kpis,ki,w){
  const keep=kpis.map((k,i)=>({k,i})).filter(x=>x.i!==ki);
  const cur=keep.reduce((s,x)=>s+x.k.w,0);
  const room=100-(w||0);
  return keep.map(x=>({...x,nw:cur?r1(x.k.w*room/cur):0}));
}

      if(w<1||w>40) return toast('Trọng số phải trong khoảng 1 đến 40%');
      const dir=segv('cDir','1')==='1'?'càng cao càng tốt':'càng thấp càng tốt';

      to=`Mục tiêu ${fmtM(Number(t0))} đến ${fmtM(Number(t1))} · trọng số ${w==null?k.w:w}%`;

      if(w!=null&&(w<1||w>40)) return toast('Trọng số phải trong khoảng 1 đến 40%');
    }else{
      const k=d.kpis[ki]; name=k.c; w=0;

    DB.chg.push({id,dept:dc,kind,ki,name,from,to,w,eff:EFF,why:why.trim(),

    SEL=null;save();toast('Đã gửi phiếu '+id+' cho HR');paint();
  },
  chgSign(id){const c=chgOf(id);c.st='hr';c.log.push({n:'HR ký · '+ME.name,at:TODAY});

    c.st=c.needCeo?'hrd':'live';
    save();toast(c.needCeo?'Đã duyệt · chuyển Tổng Giám đốc':'Đã ban hành · hiệu lực từ '+c.eff);paint()},
  chgCeo(id){const c=chgOf(id);c.st='live';c.log.push({n:'Tổng Giám đốc duyệt · '+ME.name,at:TODAY});
    save();toast('Đã ban hành · hiệu lực từ '+c.eff);paint()},
  chgBack(id){const c=chgOf(id);c.st='back';c.log.push({n:'Trả về · '+ME.name,at:TODAY});
    save();toast('Đã trả phiếu về phòng ban');paint()}
});

/* ══════════════════════════════════════════════════════════════════════════
   CHỈ TIÊU TỰ CHỌN · nhân viên tự đăng ký trong bộ chỉ tiêu của phòng mình,
   quản lý duyệt mới có hiệu lực, áp dụng từ chu kỳ kế tiếp.
   ══════════════════════════════════════════════════════════════════════════ */
const OPT={
BOD:[{c:'Số buổi làm việc với đối tác chiến lược',u:'buổi',t:[1,4],d:1},
     {c:'Tiến độ chuẩn hóa quy chế quản trị',u:'%',t:[70,100],d:1}],
EXP:[{c:'Số chào giá gửi khách tiềm năng',u:'chào giá',t:[6,16],d:1},
     {c:'Số khách cũ mua lại trong tháng',u:'khách',t:[2,7],d:1}],
DOM:[{c:'Số lượt viếng thăm điểm bán',u:'lượt',t:[20,50],d:1},
     {c:'Số điểm bán mở mới',u:'điểm',t:[1,5],d:1}],
SAD:[{c:'Số bộ chứng từ rà soát chéo cho đồng nghiệp',u:'bộ',t:[10,30],d:1},
     {c:'Thời gian phản hồi khiếu nại lần đầu',u:'giờ',t:[1,4],d:0}],
MKT:[{c:'Số nội dung tiếng Anh cho thị trường xuất khẩu',u:'bài',t:[4,12],d:1},
     {c:'Số hồ sơ năng lực cập nhật cho khách lớn',u:'hồ sơ',t:[1,4],d:1}],
SRC:[{c:'Số hộ trồng được tập huấn kỹ thuật',u:'hộ',t:[5,20],d:1},
     {c:'Số lần kiểm tra vùng trồng đột xuất',u:'lần',t:[2,8],d:1}],
PAC:[{c:'Số sáng kiến giảm hao hụt được áp dụng',u:'sáng kiến',t:[1,3],d:1},
     {c:'Số ca kèm cặp công nhân mới',u:'ca',t:[2,8],d:1}],
QAC:[{c:'Số lần lấy mẫu kiểm tra ngoài kế hoạch',u:'lần',t:[2,8],d:1},
     {c:'Số quy trình kiểm soát được viết lại rõ hơn',u:'quy trình',t:[1,3],d:1}],
LOG:[{c:'Số lần hiệu chuẩn thiết bị đo nhiệt độ',u:'lần',t:[1,4],d:1},
     {c:'Số tuyến vận chuyển được tối ưu lại',u:'tuyến',t:[1,3],d:1}],
CUS:[{c:'Số bộ hồ sơ C/O tự kiểm tra trước khi nộp',u:'bộ',t:[10,30],d:1},
     {c:'Số văn bản hải quan mới được cập nhật cho phòng',u:'văn bản',t:[1,4],d:1}],
PRC:[{c:'Số nhà cung cấp mới được khảo sát',u:'nhà cung cấp',t:[1,5],d:1},
     {c:'Số yêu cầu mua xử lý trong ngày',u:'yêu cầu',t:[5,15],d:1}],
FIN:[{c:'Số đối chiếu công nợ hoàn tất trong tháng',u:'đối chiếu',t:[8,20],d:1},
     {c:'Số báo cáo phân tích chủ động gửi ban giám đốc',u:'báo cáo',t:[1,3],d:1}],
HRA:[{c:'Số buổi đào tạo nội bộ tự đứng lớp',u:'buổi',t:[1,3],d:1},
     {c:'Số hồ sơ nhân sự được số hóa',u:'hồ sơ',t:[10,40],d:1}],
ITD:[{c:'Số hướng dẫn sử dụng viết cho người dùng nội bộ',u:'tài liệu',t:[1,4],d:1},
     {c:'Số yêu cầu hỗ trợ đóng trong ngày',u:'yêu cầu',t:[10,30],d:1}],
RND:[{c:'Số mẫu thử nghiệm hoàn tất',u:'mẫu',t:[2,6],d:1},
     {c:'Số tài liệu kỹ thuật chuyển giao cho nhà máy',u:'tài liệu',t:[1,3],d:1}]
};
const OPT_ST={wait:{n:'Chờ quản lý duyệt',cls:'o'},ok:{n:'Quản lý đã duyệt',cls:'g'},no:{n:'Quản lý không duyệt',cls:'r'}};
const optList=()=>DB.opt||(DB.opt=[]);
const optOf=id=>optList().filter(o=>o.emp===id);
const bdgO=st=>`<span class="pill ${OPT_ST[st].cls}"><i class="dot" style="background:currentColor"></i>${OPT_ST[st].n}</span>`;

/* khối gắn vào phiếu KPI của nhân viên */
function optSection(e,canAdd){
  const d=DEPT[e.dept],pool=OPT[e.dept]||[];
  const mine=optOf(e.id);
  const free=pool.map((k,i)=>({k,i})).filter(x=>!mine.some(o=>o.oi===x.i&&o.st!=='no'));
  return `<div class="card sec">
    <div class="row" style="margin-bottom:6px"><h2>Chỉ tiêu tự chọn${helpLink('doikpi','Đăng ký thêm chỉ tiêu và ai duyệt')}</h2><div class="sp"></div>
      <span class="mut" style="font-size:12px">Chọn trong bộ chỉ tiêu của ${d.n} · quản lý duyệt mới tính</span></div>
    ${mine.length?`<table><thead><tr><th style="width:38%">Chỉ tiêu</th><th class="num">Mục tiêu</th>
      <th class="num">Trọng số</th><th>Hiệu lực</th><th>Trạng thái</th></tr></thead><tbody>
      ${mine.map(o=>{const k=pool[o.oi];
        return `<tr><td><b class="hd" style="font-size:12.5px">${k.c}</b>
          <div class="mut" style="font-size:11px">${k.u} · ${k.d===1?'càng cao càng tốt':'càng thấp càng tốt'}</div></td>
        <td class="num tnum">${fmtM(o.tg)}</td><td class="num tnum">${o.w}%</td>
        <td class="mut">${o.st==='ok'?o.eff:'-'}</td><td>${bdgO(o.st)}</td></tr>`}).join('')}
      </tbody></table>`:'<div class="empty">Chưa đăng ký chỉ tiêu tự chọn nào.</div>'}
    ${canAdd&&free.length?`
      <div class="well" style="margin-top:14px">
        <div class="lbl">Chọn chỉ tiêu của phòng</div>
        <div style="margin-top:8px">${seg('oSel',free.map(x=>[x.i,x.k.c+' · '+x.k.u]),free[0].i,true)}</div>
        <div class="g2" style="margin-top:14px">
          <div><div class="lbl">Mục tiêu bạn cam kết</div>
            <input class="inp num" id="oTg" type="number" step="any" placeholder="ví dụ ${fmtM(free[0].k.t[1])}"></div>
          <div><div class="lbl">Trọng số đề xuất · 5 đến 15%</div>
            <input class="inp num" id="oW" type="number" step="1" value="10"></div>
        </div>
        <div class="row" style="margin-top:12px;gap:10px">
          <button class="btn primary" data-act="optAdd">Gửi quản lý duyệt</button>
          <span class="mut" style="font-size:12px">Bạn không tự duyệt được. Duyệt xong áp dụng từ chu kỳ ${EFF},
            trọng số lấy bớt từ các chỉ tiêu hiện có và chia lại theo tỷ lệ.</span></div>
      </div>`:canAdd?'<div class="mut" style="font-size:12px;margin-top:12px">Bạn đã đăng ký hết chỉ tiêu tự chọn của phòng.</div>':''}
  </div>`;
}
/* khối duyệt cho quản lý */
function optApprove(t){
  const w=optList().filter(o=>o.st==='wait'&&t.some(x=>x.id===o.emp));
  if(!w.length) return '';
  return `<div class="card sec">
    <div class="row" style="margin-bottom:10px"><h2>Chỉ tiêu tự chọn chờ bạn duyệt</h2><div class="sp"></div>
      <span class="pill o"><i class="dot" style="background:currentColor"></i>${w.length} phiếu</span></div>
    <table><thead><tr><th>Nhân viên</th><th style="width:32%">Chỉ tiêu đăng ký</th>
      <th class="num">Mục tiêu</th><th class="num">Trọng số</th><th></th></tr></thead><tbody>
    ${w.map(o=>{const k=OPT[o.dept][o.oi];
      return `<tr><td><b class="hd">${empName(o.emp)}</b><div class="mut" style="font-size:11px">gửi ${fmtD(o.at)}</div></td>
      <td><b class="hd" style="font-size:12.5px">${k.c}</b><div class="mut" style="font-size:11px">${k.u}</div></td>
      <td class="num tnum">${fmtM(o.tg)}</td><td class="num tnum">${o.w}%</td>
      <td class="num" style="white-space:nowrap">
        <button class="btn tiny primary" data-act="optOk|${o.id}">Duyệt</button>
        <button class="btn tiny" data-act="optNo|${o.id}">Không duyệt</button></td></tr>`}).join('')}
    </tbody></table>
    <div class="mut" style="font-size:12px;margin-top:10px">Duyệt xong chỉ tiêu áp dụng từ chu kỳ ${EFF}.
      Tháng đang chấm giữ nguyên cách tính cũ.</div>
  </div>`;
}
Object.assign(ACT,{
  optAdd(){
    const oi=Number(segv('oSel',-1));
    if(oi<0) return toast('Chọn một chỉ tiêu trong bộ của phòng');
    const tgv=(document.getElementById('oTg')||{}).value;
    const w=Number((document.getElementById('oW')||{}).value);
    if(tgv===''||tgv==null) return toast('Nhập mục tiêu bạn cam kết');
    if(!(w>=5&&w<=15)) return toast('Trọng số phải từ 5 đến 15%');
    optList().push({id:'OPT'+String(optList().length+1).padStart(3,'0'),
      emp:ME.id,dept:ME.dept,oi,tg:Number(tgv),w,st:'wait',eff:EFF,at:TODAY});
    save();toast('Đã gửi '+(ME.mgr?empName(ME.mgr):'quản lý')+' duyệt');paint();
  },
  optOk(id){const o=optList().find(x=>x.id===id);o.st='ok';o.by=ME.id;
    save();toast('Đã duyệt · áp dụng cho '+empName(o.emp)+' từ chu kỳ '+o.eff);paint()},
  optNo(id){const o=optList().find(x=>x.id===id);o.st='no';o.by=ME.id;
    save();toast('Đã từ chối đăng ký của '+empName(o.emp));paint()}
});

/* ══════════ KHỞI ĐỘNG ══════════ */
if(!load()) seedDB();
if(!DB||!DB.emps||!DB.emps.length||!DB.cyc) seedDB();
/* kiểm tra logic hệ thống chạy ngầm, chỉ ghi console - không hiển thị cho người dùng */
(()=>{const f=auditSystem().filter(x=>!x.ok);
  if(f.length) console.warn('[kiểm tra ngầm] '+f.length+' điểm cần xử lý:',f.map(x=>x.n));})();
renderLogin();
</script>
